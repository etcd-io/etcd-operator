# permissions for end users to edit etcdmirrors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: etcd-operator
    app.kubernetes.io/managed-by: kustomize
  name: etcdmirror-editor-role
rules:
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdmirrors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdmirrors/status
  verbs:
  - get
