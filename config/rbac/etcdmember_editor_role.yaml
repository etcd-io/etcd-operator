# permissions for end users to edit etcdmembers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: etcd-operator
    app.kubernetes.io/managed-by: kustomize
  name: etcdmember-editor-role
rules:
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdmembers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdmembers/status
  verbs:
  - get
