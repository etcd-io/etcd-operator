                    required:
                    - secretRef
                    type: object
                    x-kubernetes-validations:
                    - message: insecureSkipVerify requires insecureSkipVerifyAcknowledgeRisk
                        to also be true
                      rule: '!self.insecureSkipVerify || self.insecureSkipVerifyAcknowledgeRisk'
                    - message: secretRef.name is required
                      rule: has(self.secretRef.name) && size(self.secretRef.name)
                        > 0
                type: object
                x-kubernetes-validations:
                - message: exactly one of endpointList or serviceRef must be set
