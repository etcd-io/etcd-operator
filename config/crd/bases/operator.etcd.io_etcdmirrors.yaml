                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              forcedResyncCount:
                description: |-
                  ForcedResyncCount counts how many times the agent has auto-healed from a
                  source-compaction-raced-the-watch error, OR a cluster-identity-mismatch
