                    required:
                    - name
                    type: object
                  tls:
                    description: |-
                      TLS configures the agent's client TLS identity/trust for THIS side. Nil
                      means the agent dials this side in cleartext.
                    properties:
                      insecureSkipVerify:
                        default: false
