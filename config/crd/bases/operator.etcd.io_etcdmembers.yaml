---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: etcdmembers.operator.etcd.io
spec:
  group: operator.etcd.io
  names:
    kind: EtcdMember
    listKind: EtcdMemberList
    plural: etcdmembers
    singular: etcdmember
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.ordinal
      name: Ordinal
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.recreateCount
      name: RecreateCount
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EtcdMember is the Schema for the etcdmembers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EtcdMemberSpec defines the desired state of one etcd member/ordinal.
            properties:
              clusterName:
                description: ClusterName is the owning EtcdCluster's name (same namespace).
                type: string
                x-kubernetes-validations:
                - message: clusterName is immutable
                  rule: self == oldSelf
              ordinal:
                description: |-
                  Ordinal is this member's fixed position, e.g. 0, 1, 2. The member Pod
                  and PVC are named "{clusterName}-{ordinal}" / "etcd-data-{clusterName}-{ordinal}".
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: ordinal is immutable
                  rule: self == oldSelf
              version:
                description: |-
                  Version is the etcd version this member's Pod should run. Normally
                  equal to EtcdCluster.Spec.Version, but during a rolling upgrade
                  EtcdClusterReconciler bumps this one member at a time, so members can
                  transiently run different versions than the cluster's target.
                type: string
            required:
            - clusterName
            - ordinal
            - version
            type: object
          status:
            description: EtcdMemberStatus defines the observed state of a single etcd
              member.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the EtcdMember's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: CurrentVersion is the observed etcd version of this member.
                type: string
              isHealthy:
                description: |-
                  IsHealthy indicates whether the member's etcd process is healthy, as
                  observed by a live check every reconcile.
                type: boolean
              isLeader:
                description: IsLeader indicates whether this member is currently the
                  cluster leader.
                type: boolean
              isLearner:
                description: IsLearner indicates whether the member is currently a
                  learner in the etcd cluster.
                type: boolean
              lastDefragTime:
                description: |-
                  LastDefragTime records when this member last finished a defrag
                  attempt — successful or timed out. Used to tell whether this member
                  still needs defragment in the current NOSPACE cycle, without redoing
                  one already attempted.
                format: date-time
                type: string
              memberID:
                description: |-
                  MemberID is the hex etcd member ID, recorded for
                  observability/reporting only. EtcdClusterReconciler never uses this
                  persisted value to decide anything — wherever a member's live etcd
                  identity is needed (e.g. MemberRemove's target in the leave sequence),
                  it's found by a live MemberList lookup keyed on this ordinal's
                  deterministic peer URL, never by trusting this field is still
                  current.
                type: string
              memberName:
                description: |-
                  MemberName is this member's name, always "{clusterName}-{ordinal}" —
                  the same value is used as both the etcd member name and the Pod name.
                  Recorded for convenience/observability only, never used to make a
                  decision (the name is fully deterministic from Spec.Ordinal, and the
                  Pod-recovery ladder only ever needs to know whether a Pod currently
                  exists and how long it's existed, both a live check against that
                  name — no identity-tracking field is needed to tell a stale Pod apart
                  from a fresh one).
                type: string
              phase:
                description: EtcdMemberPhase is the coarse lifecycle phase of a member.
                type: string
              recreateCount:
                description: |-
                  RecreateCount is the number of consecutive Pod recreations performed
                  while trying to get this member healthy — whether it's a Provisioning
                  member whose Pod never came up, or a Ready member that regressed and
                  is now Recreating. Bumped once each recreate actually happens, after
                  the mutation rather than before. Reset to 0 both when the member
                  reaches Ready and when it escalates to Phase=Replacing. At
                  RecreateCount == 3 the reconciler gives up on "just recreate the
                  Pod" and moves to Phase=Replacing.
                format: int32
                type: integer
            required:
            - isHealthy
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
