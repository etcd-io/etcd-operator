apiVersion: operator.etcd.io/v1alpha1
kind: EtcdCluster
metadata:
  labels:
    app.kubernetes.io/name: etcd-operator
    app.kubernetes.io/managed-by: kustomize
  name: etcdcluster-sample
spec:
  version: v3.5.21
  size: 3
  # Both surfaces use the built-in self-signed provider. The auto provider
  # requires a duration of at least 8760h (365 days); Go duration units only.
  tls:
    peer:
      provider: "auto"
      auto:
        commonName: "etcd-operator-system"
        duration: "8760h"
    client:
      provider: "auto"
      auto:
        commonName: "etcd-operator-system"
        duration: "8760h"
