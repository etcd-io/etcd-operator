{{- if and .Values.controller.enabled .Values.metrics.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "etcd-operator.fullname" . }}-allow-metrics-traffic
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "etcd-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
{{- end }}
