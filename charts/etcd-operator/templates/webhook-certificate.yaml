{{- if and .Values.controller.enabled .Values.webhook.enabled .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "etcd-operator.fullname" . }}-selfsigned-issuer
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "etcd-operator.fullname" . }}-serving-cert
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "etcd-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
    - {{ include "etcd-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "etcd-operator.fullname" . }}-selfsigned-issuer
  secretName: {{ include "etcd-operator.fullname" . }}-webhook-server-cert
{{- end }}
