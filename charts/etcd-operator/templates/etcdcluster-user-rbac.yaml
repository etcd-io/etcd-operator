{{- if and .Values.controller.enabled (not .Values.controller.watchNamespace) }}
{{/*
Convenience roles for end users, from config/rbac/etcdcluster_{editor,viewer}_role.yaml.
Skipped in watchNamespace mode: the namespaced install makes no cluster-scoped writes
beyond the CRDs.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etcd-operator.fullname" . }}-etcdcluster-editor-role
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdclusters/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etcd-operator.fullname" . }}-etcdcluster-viewer-role
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operator.etcd.io
  resources:
  - etcdclusters/status
  verbs:
  - get
{{- end }}
