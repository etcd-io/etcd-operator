{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd-operator.fullname" . }}-metrics-service
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ ternary "https" "http" .Values.metrics.secure }}
      port: {{ .Values.metrics.port }}
      protocol: TCP
      targetPort: {{ .Values.metrics.port }}
  selector:
    {{- include "etcd-operator.selectorLabels" . | nindent 4 }}
{{- end }}
