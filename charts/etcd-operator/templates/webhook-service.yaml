{{- if and .Values.controller.enabled .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd-operator.fullname" . }}-webhook-service
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    {{- include "etcd-operator.selectorLabels" . | nindent 4 }}
{{- end }}
