# Configuration for GitHub's generated release notes, used by GoReleaser
# (.goreleaser.yaml). Pull requests are listed in the first matching category.
# See https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
  - title: Changes
    labels:
    - '*'
    exclude:
      labels:
      - dependencies
  # Dependabot labels its pull requests with "dependencies".
  - title: Dependencies
    labels:
    - dependencies
